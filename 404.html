<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found – Mike Downs Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Nunito", "Helvetica Neue", sans-serif;
        background-color: #FFFFFF;
        color: #1A2C42;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #DDE7EF;
        padding: 0 2rem;
        height: 64px;
        display: flex;
        align-items: center;
      }

      header a {
        font-size: 1.25rem;
        font-weight: 700;
        color: #1A2C42;
        text-decoration: none;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
      }

      .card {
        background-color: #F0F7FF;
        border: 1px solid #DDE7EF;
        border-radius: 10px;
        padding: 3rem 2.5rem;
        max-width: 520px;
        width: 100%;
        text-align: left;
      }

      .error-label {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #2F7EC8;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 2.75rem;
        font-weight: 700;
        color: #1A2C42;
        line-height: 1.2;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #4A6882;
        margin-bottom: 2rem;
      }

      .btn {
        display: inline-block;
        background-color: #3E7E5F;
        color: #ffffff;
        font-family: "Nunito", sans-serif;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.6rem 1.5rem;
        border-radius: 10px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .btn:hover { background-color: #295C43; }

      footer {
        border-top: 1px solid #DDE7EF;
        background-color: #F0F7FF;
        padding: 1.25rem 2rem;
        text-align: center;
        font-size: 1rem;
        color: #4A6882;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="https://mdowns1999.github.io/downs-portfolio">MIKE DOWNS</a>
    </header>

    <main>
      <div class="card">
        <p class="error-label">404 – Page Not Found</p>
        <h1>This page doesn't exist.</h1>
        <p>The page you're looking for may have been moved or removed. Head back to the main site to find what you need.</p>
        <a class="btn" href="https://mdowns1999.github.io/downs-portfolio">Back to Home</a>
      </div>
    </main>

    <footer>
      &copy; Mike Downs 2026
    </footer>
  </body>
</html>
